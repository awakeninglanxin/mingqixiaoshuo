<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>明锜天眼 · 角色关系图谱</title>
<style>
  :root {
    --bg0: #070a1f; --bg1: #0d1233; --bg2: #141a4a;
    --gold: #f5c86a; --gold-soft: #ffdf9e; --lavender: #b8a8e8;
    --blue: #7fb4ff; --cyan: #8fe3e8; --text: #e8e6ff; --text-dim: #a8a4d0;
    --card-bg: rgba(20, 26, 74, 0.55); --card-border: rgba(245, 200, 106, 0.18);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: radial-gradient(ellipse at 50% -10%, #1b2358 0%, var(--bg0) 55%, #04061a 100%);
    color: var(--text); font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    min-height: 100vh; overflow-x: hidden; line-height: 1.7;
  }
  .stars { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  .star { position: absolute; border-radius: 50%; background: #fff; animation: twinkle var(--dur,4s) ease-in-out infinite; opacity: 0; }
  @keyframes twinkle { 0%,100% { opacity: 0; transform: scale(.6);} 50% { opacity: var(--op,.9); transform: scale(1);} }
  .glow-orb { position: fixed; border-radius: 50%; filter: blur(90px); z-index: 0; pointer-events: none; opacity: .35; }
  .orb1 { width: 420px; height: 420px; background: #4a3f9e; top: -120px; right: -80px; }
  .orb2 { width: 380px; height: 380px; background: #2c4a8e; bottom: -100px; left: -100px; }

  .wrap { position: relative; z-index: 1; max-width: 1200px; margin: 0 auto; padding: 50px 20px 80px; }
  header { text-align: center; margin-bottom: 34px; }
  .title {
    font-size: clamp(28px, 4.5vw, 46px); font-weight: 800; letter-spacing: 6px;
    background: linear-gradient(135deg, var(--gold-soft), var(--gold) 40%, #fff3d6 70%, var(--gold));
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent;
    text-shadow: 0 0 60px rgba(245,200,106,.25);
  }
  .subtitle { color: var(--lavender); font-size: 13px; letter-spacing: 6px; margin-top: 12px; }
  .hint { color: var(--text-dim); font-size: 12.5px; margin-top: 16px; letter-spacing: 1px; }

  /* 图区 */
  #graphWrap { position: relative; margin: 20px auto 0; max-width: 1150px; }
  #graph { width: 100%; height: auto; display: block; }
  .node-group { cursor: pointer; }
  .node-ring { transition: all .3s ease; }
  .node-label { font-size: 13px; fill: var(--text); font-weight: 600; letter-spacing: 1px; pointer-events: none; }
  .node-sub { font-size: 9.5px; fill: var(--text-dim); letter-spacing: 0.5px; pointer-events: none; }
  .edge { stroke: rgba(245,200,106,.22); stroke-width: 1.2; transition: all .3s ease; }
  .edge.hl { stroke: var(--gold); stroke-width: 2.2; filter: drop-shadow(0 0 4px rgba(245,200,106,.6)); }
  .node-ring { fill: rgba(20,26,74,.85); stroke-width: 2; }
  .node-core { fill: var(--gold); opacity: .9; }
  .node-group:hover .node-ring { filter: drop-shadow(0 0 10px rgba(245,200,106,.7)); stroke-width: 3; }
  .node-group.dim .node-ring { opacity: .25; }
  .node-group.dim .node-label, .node-group.dim .node-sub { opacity: .25; }

  /* 图例 */
  .legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 26px; font-size: 12.5px; color: var(--text-dim); }
  .legend .lg { display: flex; align-items: center; gap: 7px; }
  .legend .chip { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
  .chip.c-gold { background: var(--gold); box-shadow: 0 0 8px rgba(245,200,106,.8); }
  .chip.c-blue { background: var(--blue); }
  .chip.c-cyan { background: var(--cyan); }
  .chip.c-lav { background: var(--lavender); }
  .chip.c-purple { background: #8a6fd8; }
  .chip.c-gray { background: #6f6f96; }

  /* 信息面板 */
  #infoPanel {
    margin: 26px auto 0; max-width: 800px; min-height: 90px;
    background: var(--card-bg); border: 1px solid var(--card-border);
    border-radius: 14px; padding: 18px 24px; backdrop-filter: blur(8px);
    transition: border-color .3s ease;
  }
  #infoPanel .p-name { font-size: 18px; font-weight: 700; color: var(--gold-soft); letter-spacing: 2px; }
  #infoPanel .p-role { font-size: 12.5px; color: var(--cyan); margin-top: 3px; letter-spacing: 1px; }
  #infoPanel .p-desc { font-size: 13px; color: var(--text-dim); margin-top: 8px; line-height: 1.8; }
  #infoPanel .p-links { margin-top: 10px; font-size: 12.5px; color: var(--lavender); line-height: 1.9; }
  #infoPanel .p-links b { color: var(--gold); font-weight: 600; }
  #infoPanel .default { color: var(--text-dim); font-size: 13.5px; text-align: center; padding: 14px 0; }

  footer { text-align: center; margin-top: 40px; color: rgba(168,164,208,.5); font-size: 12px; letter-spacing: 2px; }
</style>
</head>
<body>

<div class="stars" id="stars"></div>
<div class="glow-orb orb1"></div>
<div class="glow-orb orb2"></div>

<div class="wrap">
  <header>
    <div class="title">明 锜 天 眼 · 角 色 关 系</div>
    <div class="subtitle">CHARACTER RELATIONSHIP GRAPH · 17节点 · 26条关系</div>
    <div class="hint">悬停节点查看人物信息与关系链 · 明锜为全图中心</div>
  </header>

  <div id="graphWrap">
    <svg id="graph" viewBox="0 0 1100 780" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="goldCore" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#fff7e0"/>
          <stop offset="60%" stop-color="#f5c86a"/>
          <stop offset="100%" stop-color="#a8781f"/>
        </radialGradient>
        <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      </defs>
      <g id="edges"></g>
      <g id="nodes"></g>
    </svg>
  </div>

  <div class="legend">
    <div class="lg"><span class="chip c-gold"></span>主角</div>
    <div class="lg"><span class="chip c-blue"></span>导师金三角</div>
    <div class="lg"><span class="chip c-cyan"></span>核心团队</div>
    <div class="lg"><span class="chip c-lav"></span>引路人</div>
    <div class="lg"><span class="chip c-purple"></span>后加入成员</div>
    <div class="lg"><span class="chip c-gray"></span>投资方 / 星际</div>
  </div>

  <div id="infoPanel">
    <div class="default">👆 悬停任意角色节点，查看人物档案与关系链</div>
  </div>

  <footer>明锜天眼 · 人物关系图谱 · 数据源：01_设定文档/人物关系图谱_节点.csv + 边.csv</footer>
</div>

<script>
// ===== 数据 =====
var NODES = [
  { id:"MQ",  name:"明锜", sub:"主角·358证道", x:550, y:390, r:34, color:"gold", grp:"主角",
    role:"天眼持有者·团队领袖·富二代·28觉醒→43元婴",
    desc:"28岁觉醒天眼 → 34岁二果圆满 → 37岁三果初开（初结丹·48根DNA）→ 40岁三果圆满（金仙）→ 43岁元婴出关（四果罗汉圆满）。使命：把能让人往回走的知识链接起来，带全人类走向人人修真。" },
  { id:"WLS", name:"王老师", sub:"佛陀罗尼·文化", x:310, y:110, r:24, color:"blue", grp:"导师",
    role:"序章第一位导师",
    desc:"法号佛陀罗尼。授身心性法四句偈、七级浮屠、言出法随——文化地图。未与明锜相见，文字即钥匙。" },
  { id:"LGD", name:"卢国东", sub:"卢先生·科技", x:550, y:70, r:24, color:"blue", grp:"导师",
    role:"序章第五位引路人",
    desc:"慈海科技创始人。授科技验证·DNA 46→72 NDA 解锁·辉光测量——实证工具。灵魂积分提出者。" },
  { id:"QFLR", name:"千峰老人", sub:"以武入道", x:790, y:110, r:24, color:"blue", grp:"导师",
    role:"序章第四位引路人",
    desc:"龙门派第十一代传人（1860-1942）。授命功筑基·四大手·以武入道——身体功法。" },
  { id:"ZLS", name:"张老师", sub:"濒死实证", x:920, y:250, r:20, color:"blue", grp:"引路人",
    role:"序章引路人",
    desc:"密勒日巴虹光传承·濒死体验研究·实修十二字。住明锜家十六天，放濒死演讲视频。" },
  { id:"YG", name:"元光大师", sub:"肉眼通·理论根基", x:320, y:250, r:24, color:"lav", grp:"引路人",
    role:"团队唯一不碰仪器的人",
    desc:"70岁·四六通达修行者（精气神全亮）·前北大物理系肄业。肉眼通观测ANU·七级螺旋·玻色子超导管道。名言：如果它不像ANU，它就不会自己冷。" },
  { id:"CS", name:"陈熵", sub:"材料学博士", x:200, y:480, r:20, color:"cyan", grp:"团队",
    role:"核心成员·材料",
    desc:"28岁·MIT室温超导提案被导师否决——距成功只差0.3%晶格错位修正。金丹疗愈仓操作者。" },
  { id:"XY", name:"萧衍", sub:"量子物理博士后", x:320, y:570, r:20, color:"cyan", grp:"团队",
    role:"核心成员·量子·AHCS",
    desc:"26岁·arXiv 37篇不被引用的论文，第23篇已用另一种数学描述SEG核心机制。AHCS核心工程师。" },
  { id:"WG", name:"魏工", sub:"前电网首席", x:520, y:640, r:20, color:"cyan", grp:"团队",
    role:"核心成员·电力",
    desc:"43岁·前国家电网首席工程师。唐古拉山口测试闭合磁路发电机，数据锁U盘7年。" },
  { id:"LY", name:"洛言", sub:"前政策研究员", x:730, y:600, r:20, color:"cyan", grp:"团队",
    role:"核心成员·政策",
    desc:"35岁·前商务部政策研究员。三次力排众议推动新能源开放标准，三次被搁置。" },
  { id:"AB", name:"阿丙·炜瀚", sub:"机械神童", x:900, y:480, r:22, color:"cyan", grp:"团队",
    role:"核心成员·机械·量天尺",
    desc:"24岁·官二代·少时体弱多病谐音'病'得名'阿丙'·少年修道家气功·后得明锜指导改名炜瀚（补五行水火）。量天尺持有者·幻方NoC。" },
  { id:"JC", name:"静慈", sub:"明锜之妻", x:720, y:320, r:24, color:"cyan", grp:"团队",
    role:"妻子·中医医师·金丹初开",
    desc:"38岁·中医世家天才医师·金丹初开（二果圆满）·受元光大师指导·少经生死劫淡泊名利。元婴出关后结发为妻，终成神仙伴侣·无量寿。" },
  { id:"SJ", name:"苏晶", sub:"晶体学家", x:110, y:330, r:22, color:"purple", grp:"后加入",
    role:"后加入·晶体学·数学路径",
    desc:"31岁·前苏黎世ETH晶体学研究员。230空间群·晶格编译器·幻方NoC。数学路径与肉眼通独立互证ANU。" },
  { id:"WH", name:"卫衡", sub:"磁材料物理学家", x:1000, y:350, r:20, color:"purple", grp:"后加入",
    role:"后加入·磁饱和SEG",
    desc:"38岁·前中科院·'卫熔断'。铁心B-H曲线过饱和尖峰发现者——零点能/暗能量线。" },
  { id:"WL", name:"温灵", sub:"声学工程师", x:1060, y:520, r:20, color:"purple", grp:"后加入",
    role:"后加入·369同情振动",
    desc:"29岁·声学振动工程师·Keely体系研究者。369共振腔·AHCS声学线。" },
  { id:"FZ", name:"方总", sub:"投资人", x:1030, y:180, r:20, color:"gray", grp:"投资",
    role:"投资方·组队",
    desc:"投资人/老板。给钱给政策·组队·三件事（电池/SEG/飞碟）。代卢先生联合国发布灵魂积分。" },
  { id:"ANK", name:"安妮卡", sub:"昴宿二代表", x:180, y:180, r:20, color:"gray", grp:"星际",
    role:"星际引导者",
    desc:"昴宿二代表。频率导航·建交·揭示累世记忆。星际线关键牵引节点。" },
];

var EDGES = [
  ["WLS","MQ","师徒","授身心性法·七级浮屠·言出法随"],
  ["LGD","MQ","师徒","授科技验证·DNA 46→72 NDA·辉光测量"],
  ["QFLR","MQ","师徒","授命功筑基·四大手·以武入道"],
  ["ZLS","MQ","引路","密勒日巴虹光传承·濒死实证"],
  ["YG","MQ","道友","肉眼通↔天眼同路观测亚原子"],
  ["MQ","CS","领导","团队领袖·材料攻关"],
  ["MQ","XY","领导","团队领袖·AHCS核心"],
  ["MQ","WG","领导","团队领袖·电力闭合磁路"],
  ["MQ","LY","领导","团队领袖·政策开放标准"],
  ["MQ","AB","师徒","指导阿丙·量天尺·少走弯路"],
  ["MQ","JC","夫妻","元婴出关后结发·神仙伴侣·无量寿"],
  ["MQ","SJ","道友","数学路径↔天眼互证·230与ANU"],
  ["MQ","WH","同事","磁饱和SEG·卫衡加入"],
  ["MQ","WL","同事","369振动·温灵加入"],
  ["FZ","MQ","投资","组队·给钱给政策"],
  ["WH","FZ","自荐","电话方总·磁芯饱和"],
  ["WL","FZ","自荐","邮件方总·369共振腔"],
  ["AB","JC","同修","皆团队同修道友"],
  ["YG","JC","师徒","元光指导静慈修至金丹初开"],
  ["SJ","YG","互证","数学与灵视·交汇不推导"],
  ["WLS","LGD","互证","科技翻译言出法随"],
  ["WLS","QFLR","互证","言与武同源"],
  ["LGD","QFLR","互证","命功↔科技·隔百年握手"],
  ["WLS","ZLS","同源","言出法随↔密勒日巴实证"],
  ["ANK","MQ","引导","频率导航·建交·累世记忆"],
  ["ANK","SJ","交流","苏晶解读昴宿频率图"],
];

var COLOR = {
  gold:  ["url(#goldCore)", "#f5c86a"],
  blue:  ["#2a3f8e", "#7fb4ff"],
  cyan:  ["#1e5a66", "#8fe3e8"],
  lav:   ["#3a2f6e", "#b8a8e8"],
  purple:["#4a2f7e", "#b08fe8"],
  gray:  ["#3a3a5e", "#9a9ac8"],
};

// ===== 渲染 =====
var edgesG = document.getElementById("edges");
var nodesG = document.getElementById("nodes");
var edgesMap = {};
EDGES.forEach(function(e, i) {
  var s = NODES.find(function(n){ return n.id === e[0]; });
  var t = NODES.find(function(n){ return n.id === e[1]; });
  var line = document.createElementNS("http://www.w3.org/2000/svg", "line");
  line.setAttribute("class", "edge");
  line.setAttribute("id", "edge-" + i);
  line.setAttribute("x1", s.x); line.setAttribute("y1", s.y);
  line.setAttribute("x2", t.x); line.setAttribute("y2", t.y);
  edgesG.appendChild(line);
  (edgesMap[s.id] = edgesMap[s.id] || []).push(line);
  (edgesMap[t.id] = edgesMap[t.id] || []).push(line);
});

NODES.forEach(function(n) {
  var g = document.createElementNS("http://www.w3.org/2000/svg", "g");
  g.setAttribute("class", "node-group");
  g.setAttribute("id", "node-" + n.id);

  var ring = document.createElementNS("http://www.w3.org/2000/svg", "circle");
  ring.setAttribute("class", "node-ring");
  ring.setAttribute("cx", n.x); ring.setAttribute("cy", n.y); ring.setAttribute("r", n.r);
  ring.setAttribute("fill", COLOR[n.color][0]);
  ring.setAttribute("stroke", COLOR[n.color][1]);
  if (n.color === "gold") ring.setAttribute("filter", "url(#glow)");

  var core = document.createElementNS("http://www.w3.org/2000/svg", "circle");
  core.setAttribute("class", "node-core");
  core.setAttribute("cx", n.x); core.setAttribute("cy", n.y); core.setAttribute("r", 4);
  core.setAttribute("fill", COLOR[n.color][1]);

  var label = document.createElementNS("http://www.w3.org/2000/svg", "text");
  label.setAttribute("class", "node-label");
  label.setAttribute("x", n.x); label.setAttribute("y", n.y + 4);
  label.setAttribute("text-anchor", "middle");
  label.textContent = n.name;

  var sub = document.createElementNS("http://www.w3.org/2000/svg", "text");
  sub.setAttribute("class", "node-sub");
  sub.setAttribute("x", n.x); sub.setAttribute("y", n.y + n.r + 16);
  sub.setAttribute("text-anchor", "middle");
  sub.textContent = n.sub;

  g.appendChild(ring); g.appendChild(core); g.appendChild(label); g.appendChild(sub);
  g.addEventListener("mouseenter", function() { highlight(n.id); });
  g.addEventListener("mouseleave", function() { unhighlight(); });
  nodesG.appendChild(g);
});

// ===== 高亮 =====
var panel = document.getElementById("infoPanel");

function highlight(id) {
  var node = NODES.find(function(n){ return n.id === id; });
  var related = {};
  EDGES.forEach(function(e) {
    if (e[0] === id) related[e[1]] = e;
    if (e[1] === id) related[e[0]] = e;
  });
  // 边高亮
  Object.keys(edgesMap).forEach(function(k) {
    edgesMap[k].forEach(function(l) { l.classList.remove("hl"); });
  });
  (edgesMap[id] || []).forEach(function(l) { l.classList.add("hl"); });
  // 节点淡化
  document.querySelectorAll(".node-group").forEach(function(g) { g.classList.add("dim"); });
  document.getElementById("node-" + id).classList.remove("dim");
  Object.keys(related).forEach(function(rid) {
    var rg = document.getElementById("node-" + rid);
    if (rg) rg.classList.remove("dim");
  });
  // 面板
  var links = Object.keys(related).map(function(rid) {
    var e = related[rid];
    var other = e[0] === id ? e[1] : e[0];
    var n = NODES.find(function(x){ return x.id === other; });
    return "<b>" + e[2] + "</b> → " + n.name + "（" + e[3] + "）";
  }).join("<br>");
  panel.innerHTML = "<div class='p-name'>" + node.name + "</div>" +
    "<div class='p-role'>" + node.role + " · " + node.grp + "</div>" +
    "<div class='p-desc'>" + node.desc + "</div>" +
    "<div class='p-links'>" + links + "</div>";
}

function unhighlight() {
  document.querySelectorAll(".node-group").forEach(function(g) { g.classList.remove("dim"); });
  Object.keys(edgesMap).forEach(function(k) {
    edgesMap[k].forEach(function(l) { l.classList.remove("hl"); });
  });
  panel.innerHTML = "<div class='default'>👆 悬停任意角色节点，查看人物档案与关系链</div>";
}

// ===== 星光 =====
(function () {
  var stars = document.getElementById('stars');
  for (var i = 0; i < 90; i++) {
    var s = document.createElement('div');
    s.className = 'star';
    var size = (Math.random() * 2 + 0.6).toFixed(1);
    s.style.width = size + 'px'; s.style.height = size + 'px';
    s.style.left = (Math.random() * 100).toFixed(2) + '%';
    s.style.top = (Math.random() * 100).toFixed(2) + '%';
    s.style.setProperty('--dur', (Math.random() * 5 + 2.5).toFixed(1) + 's');
    s.style.setProperty('--op', (Math.random() * 0.7 + 0.3).toFixed(2));
    s.style.animationDelay = (Math.random() * 6).toFixed(1) + 's';
    stars.appendChild(s);
  }
})();
</script>
</body>
</html>
